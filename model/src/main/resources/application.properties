########################
# Timefold Solver properties
########################

# Default solve time. Each request can override it with ?limitSeconds=5..60.
quarkus.timefold.solver.termination.spent-limit=30s

# To change how many solvers to run in parallel
# timefold.solver-manager.parallel-solver-count=4

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

quarkus.log.category."ai.timefold.solver".level=INFO

########################
# App properties
########################

# HTTP ports (8080 clashes with other local Quarkus apps). Tests use their own port.
quarkus.http.port=8083
quarkus.http.test-port=8084

# Directory with scenario JSON files written by data-gen (relative to the model/ folder).
app.data-dir=../data-gen/out

# CORS for the Vite dev server (the Vite proxy makes it unnecessary, but it's cheap).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

%test.quarkus.timefold.solver.termination.spent-limit=10s
%test.app.data-dir=src/test/resources

# Workaround for https://github.com/quarkusio/quarkus/issues/55362
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=false
